services:
  - type: web
    name: ojo99-omega
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SYNC_ENABLED
        value: "true"
      - key: AUTO_SYNC_MINUTES
        value: "15"
      - key: HISTORICAL_BACKFILL_ENABLED
        value: "true"
      - key: HISTORICAL_DAYS_TARGET
        value: "730"
      - key: HISTORICAL_DAYS_PER_STEP
        value: "3"
